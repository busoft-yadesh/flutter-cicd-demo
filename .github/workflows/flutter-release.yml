name: Flutter Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: flutter pub get

      # --------------------------------------------------
      # 4. Check formatting
      # --------------------------------------------------
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # --------------------------------------------------
      # 5. Analyze Flutter code
      # --------------------------------------------------
      - name: Analyze code
        run: flutter analyze

      # --------------------------------------------------
      # 6. Run Flutter tests
      # --------------------------------------------------
      - name: Run tests
        run: flutter test

      # --------------------------------------------------
      # 7. Build STAGING APK
      # --------------------------------------------------
      - name: Build staging APK
        run: |
          flutter build apk \
            --flavor staging \
            --release \
            --dart-define=ENVIRONMENT=staging

      # --------------------------------------------------
      # 8. Rename APK
      # --------------------------------------------------
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-staging-release.apk \
             flutter-cicd-demo-staging-${{ github.ref_name }}.apk

      # --------------------------------------------------
      # 9. Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "flutter-cicd-demo-staging-${{ github.ref_name }}.apk" \
            --title "Flutter CI Demo ${{ github.ref_name }}" \
            --generate-notes

      # --------------------------------------------------
      # 10. Notify Microsoft Teams
      # --------------------------------------------------
      - name: Notify Teams
        if: success()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          response=$(curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": null,
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.2",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": "🚀 Flutter Staging Release Ready",
                        "weight": "Bolder",
                        "size": "Medium"
                      },
                      {
                        "type": "FactSet",
                        "facts": [
                          {
                            "title": "Environment",
                            "value": "STAGING"
                          },
                          {
                            "title": "Build",
                            "value": "Android APK"
                          },
                          {
                            "title": "Version",
                            "value": "${{ github.ref_name }}"
                          }
                        ]
                      },
                      {
                        "type": "TextBlock",
                        "text": "The staging APK has been successfully built and released.",
                        "wrap": true
                      },
                      {
                        "type": "TextBlock",
                        "text": "GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}",
                        "wrap": true
                      }
                    ]
                  }
                }
              ]
            }' \
            -w "\nHTTP_STATUS:%{http_code}" \
            "$TEAMS_WEBHOOK_URL")

          echo "$response"

          status=$(echo "$response" | sed -n 's/.*HTTP_STATUS://p')

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Teams webhook request failed with HTTP status: $status"
            exit 1
          fi

          echo "Teams webhook request accepted with HTTP status: $status"
